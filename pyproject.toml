[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autoreaper"
version = "0.1.0"
description = "REAPER tools for Claude Code: inspect and edit the open project, render and measure audio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "filelock>=3.16,<4",
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "soundfile>=0.12,<1",
]

[project.scripts]
autoreaper = "autoreaper.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "lupa>=2"]

[tool.hatch.build.targets.wheel]
packages = ["src/autoreaper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
