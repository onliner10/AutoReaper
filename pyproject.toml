[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autoreaper"
version = "0.1.1"
description = "REAPER tools for Claude Code: inspect and edit the open project, render and measure audio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "filelock>=3.16,<4",
]

[project.scripts]
autoreaper = "autoreaper.__main__:main"

[dependency-groups]
# numpy, soundfile and Pillow are for the skill's analyze.py script, which uv runs on its own.
dev = ["pytest>=8", "lupa>=2", "numpy>=1.26", "soundfile>=0.12", "Pillow>=10"]

[tool.hatch.build.targets.wheel]
packages = ["src/autoreaper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
