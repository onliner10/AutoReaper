name: Package the Faust plugin

# Builds "AutoReaper Faust" with the official Faust release's libfaust (LLVM
# included) and packages both, with the Faust libraries, for each system; then
# tests each package on a clean runner without Faust.

on:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release faust-plugin-v<plugin version> from the default branch
        type: boolean
        default: false

env:
  FAUST_VERSION: 2.88.0

jobs:
  package:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, os: ubuntu-22.04}
          - {target: macos-arm64, os: macos-14, arch: arm64}
          - {target: macos-x64, os: macos-14, arch: x86_64}
          - {target: windows-x64, os: windows-2022}
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Faust release (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libx11-dev
          gh release download "$FAUST_VERSION" --repo grame-cncm/faust --pattern 'libfaust-ubuntu-x86_64.zip' --pattern "faust-$FAUST_VERSION.tar.gz"
          unzip -q libfaust-ubuntu-x86_64.zip -d libfaust
          tar xzf "faust-$FAUST_VERSION.tar.gz"
          root="$PWD/faust-root"
          mkdir -p "$root/lib" "$root/include" "$root/share"
          cp -a libfaust/lib/libfaust.so* "$root/lib/"
          # The release ships libfaust.so; programs ask for its SONAME (libfaust.so.2).
          soname=$(readelf -d "$root/lib/libfaust.so" | sed -n 's/.*Library soname: \[\(.*\)\]/\1/p')
          [ -n "$soname" ] && [ ! -e "$root/lib/$soname" ] && ln -s libfaust.so "$root/lib/$soname"
          cp -a "faust-$FAUST_VERSION/architecture/faust" "$root/include/faust"
          mkdir -p "$root/share/faust" && cp "faust-$FAUST_VERSION"/libraries/*.lib "$root/share/faust/"
          cp "faust-$FAUST_VERSION/COPYING.txt" "$root/" 2>/dev/null || true
          ls "$root/lib" "$root/include/faust/dsp" | head; ls "$root/share/faust" | wc -l
          echo "glibc needed by libfaust: $(objdump -T $root/lib/libfaust.so* | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)"
          echo "FAUST_ROOT=$root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib" >> "$GITHUB_ENV"

      - name: Faust release (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg_arch=${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}
          gh release download "$FAUST_VERSION" --repo grame-cncm/faust --pattern "Faust-$FAUST_VERSION-$dmg_arch.dmg"
          hdiutil attach "Faust-$FAUST_VERSION-$dmg_arch.dmg" -mountpoint /Volumes/faust -nobrowse -quiet
          cp -R "/Volumes/faust/Faust-$FAUST_VERSION" faust-root
          hdiutil detach /Volumes/faust -quiet
          ls faust-root faust-root/lib; lipo -info faust-root/lib/libfaust.$FAUST_VERSION.dylib
          echo "FAUST_ROOT=$PWD/faust-root" >> "$GITHUB_ENV"

      - name: Faust release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gh release download $env:FAUST_VERSION --repo grame-cncm/faust --pattern "Faust-$env:FAUST_VERSION-win64.exe" --dir "$env:RUNNER_TEMP"
          Start-Process "$env:RUNNER_TEMP\Faust-$env:FAUST_VERSION-win64.exe" -ArgumentList '/S' -Wait
          Get-ChildItem 'C:\Program Files\Faust' | ForEach-Object { $_.Name }
          "FAUST_ROOT=C:\Program Files\Faust" >> $env:GITHUB_ENV
          "C:\Program Files\Faust\lib" >> $env:GITHUB_PATH

      - name: Build
        shell: bash
        run: |
          extra=()
          [ -n "${{ matrix.arch }}" ] && extra+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}")
          cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release -DAUTOREAPER_PACKAGE=ON -DFAUST_DIR="$FAUST_ROOT" "${extra[@]}"
          cmake --build build --config Release --parallel 4

      - name: Test the build
        shell: bash
        run: |
          run() { if [ "${{ matrix.arch }}" = x86_64 ]; then arch -x86_64 "$@"; else "$@"; fi; }
          find_one() { find build \( -name "$1" -o -name "$1.exe" \) -type f | head -1; }
          export AUTOREAPER_FAUST_LIBRARIES="$FAUST_ROOT/share/faust"
          case "$RUNNER_OS" in
            Windows) powershell -Command "(Get-CimInstance Win32_Processor).Name" ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
            *) grep -m1 'model name' /proc/cpuinfo ;;
          esac
          run "$(find_one engine_test)"

      - name: Package
        shell: bash
        run: python plugin/package.py --build build --faust "$FAUST_ROOT" --faust-version "$FAUST_VERSION" --out dist --name "autoreaper-faust-${{ matrix.target }}"

      - name: Keep the host test for the clean runner
        shell: bash
        run: |
          mkdir -p tools
          cp "$(find build \( -name clap_host_test -o -name clap_host_test.exe \) -type f | head -1)" tools/

      - uses: actions/upload-artifact@v4
        with:
          name: autoreaper-faust-${{ matrix.target }}
          path: dist/autoreaper-faust-${{ matrix.target }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: host-test-${{ matrix.target }}
          path: tools/

  clean-test:
    name: Package on a clean ${{ matrix.target }} runner
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, os: ubuntu-24.04}
          - {target: macos-arm64, os: macos-14}
          - {target: macos-x64, os: macos-14, rosetta: true}
          - {target: windows-x64, os: windows-2022}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: "autoreaper-faust-${{ matrix.target }}"}
      - uses: actions/download-artifact@v4
        with: {name: "host-test-${{ matrix.target }}", path: tools}
      - name: No Faust on this runner
        shell: bash
        run: |
          ! command -v faust
          for dir in /usr/share/faust /usr/local/share/faust /opt/homebrew/share/faust "/c/Program Files/Faust"; do
            test ! -e "$dir" || { echo "Faust found at $dir"; exit 1; }
          done
      - name: Unpack and load the plugin as a host does
        shell: bash
        run: |
          unzip -q "autoreaper-faust-${{ matrix.target }}.zip"
          find "AutoReaper Faust" -maxdepth 3 | head -20
          cat "AutoReaper Faust/INSTALL.txt"
          grep -q "with Faust $FAUST_VERSION included" "AutoReaper Faust/INSTALL.txt"
          chmod +x tools/clap_host_test* || true
          if [ "${{ matrix.rosetta }}" = true ]; then arch -x86_64 tools/clap_host_test "AutoReaper Faust/AutoReaper Faust.clap"
          else tools/clap_host_test* "AutoReaper Faust/AutoReaper Faust.clap"; fi

  release:
    # On a tag faust-plugin-v<version>, or from the Actions tab (Run workflow, publish), publish the tested zips
    # as the release install_faust_plugin downloads; on other pushes, check the same files without publishing.
    name: Release
    needs: [package, clean-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "autoreaper-faust-*", path: dist, merge-multiple: true}
      - name: Checksums and versions
        run: |
          plugin=$(sed -n 's/^project([^ ]* VERSION \([^ )]*\).*/\1/p' plugin/CMakeLists.txt)
          server=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" src/autoreaper/faust_plugin.py)
          echo "plugin $plugin, server expects $server"
          [ "$plugin" = "$server" ]
          if [ "$GITHUB_REF_TYPE" = tag ]; then [ "$GITHUB_REF_NAME" = "faust-plugin-v$plugin" ]; fi
          cd dist
          ls -la
          [ "$(ls autoreaper-faust-*.zip | wc -l)" = 4 ]
          sha256sum autoreaper-faust-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "PLUGIN_VERSION=$plugin" >> "$GITHUB_ENV"
      - name: Publish
        if: >-
          (github.ref_type == 'tag' && startsWith(github.ref_name, 'faust-plugin-v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"; from=(--verify-tag)
          else
            # The Actions button: GitHub makes the tag on this commit.
            [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ] ||
              { echo "Publish from ${{ github.event.repository.default_branch }}, not $GITHUB_REF_NAME"; exit 1; }
            tag="faust-plugin-v$PLUGIN_VERSION"; from=(--target "$GITHUB_SHA")
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag exists already; raise the version in plugin/CMakeLists.txt and faust_plugin.py"; exit 1
          fi
          cat > notes.md <<NOTES
          The Faust (AutoReaper) CLAP plugin $PLUGIN_VERSION with Faust $FAUST_VERSION (libfaust and the Faust
          libraries) included. AutoReaper's install_faust_plugin tool installs it; to install by hand, see
          INSTALL.txt in the zip for your system.
          NOTES
          gh release create "$tag" dist/autoreaper-faust-*.zip dist/SHA256SUMS.txt \
            --title "Faust plugin $PLUGIN_VERSION" --notes-file notes.md "${from[@]}"
