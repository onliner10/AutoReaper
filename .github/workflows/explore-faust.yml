name: Explore Faust releases (temporary, removed after use)

on:
  push:
    paths: ['.github/workflows/explore-faust.yml']
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release view --repo grame-cncm/faust --json tagName,assets --jq '.tagName, (.assets[] | "\(.name) \(.size)")'

  macos:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh release download --repo grame-cncm/faust --pattern '*arm64.dmg' --dir dmg || gh release download --repo grame-cncm/faust --pattern '*.dmg' --dir dmg
          ls -la dmg
          hdiutil attach dmg/*.dmg -mountpoint /Volumes/faust -nobrowse
          find /Volumes/faust -maxdepth 4 | head -50
          for f in $(find /Volumes/faust -name 'libfaust*.dylib' -o -name 'libfaust*.a' | head -10); do ls -la "$f"; done
          for f in $(find /Volumes/faust -name 'libfaust*.dylib' | head -3); do echo "== $f"; otool -L "$f"; lipo -info "$f"; done
          find /Volumes/faust -name stdfaust.lib
          find /Volumes/faust -name llvm-dsp.h

  windows:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: pwsh
        run: |
          gh release download --repo grame-cncm/faust --pattern '*win64.exe' --dir "$env:RUNNER_TEMP"
          $installer = Get-ChildItem "$env:RUNNER_TEMP" -Filter '*win64.exe' | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          Get-ChildItem 'C:\Program Files\Faust' -Recurse -Include *.dll, *.lib | ForEach-Object { "{0} {1}" -f $_.FullName, $_.Length }
          $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          Get-ChildItem 'C:\Program Files\Faust' -Recurse -Filter faust*.dll | ForEach-Object { "== $($_.FullName)"; & $dumpbin.FullName /dependents $_.FullName }

  linux:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q faust libfaust-static
          ls -la /usr/lib/x86_64-linux-gnu/libfaust*
          ldd /usr/lib/x86_64-linux-gnu/libfaust.so
          dpkg -L libfaust-static | head
